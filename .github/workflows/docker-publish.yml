name: Testar e publicar imagem Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: sal0-autostart-release
  cancel-in-progress: false

jobs:
  test-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Testar regras, persistência, autenticação e disco
        run: python -m unittest discover -s tests -v
      - name: Validar JavaScript e Compose
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          html = Path('index.html').read_text()
          script = re.search(r'<script nonce="__CSP_NONCE__">(.*?)</script>', html, re.S).group(1)
          with tempfile.TemporaryDirectory() as directory:
              target = Path(directory) / 'app.js'
              target.write_text(script)
              subprocess.run(['node', '--check', str(target)], check=True)
          PY
          node tests/test_ui.cjs
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.yml -f compose.build.yml config -q
      - id: version
        name: Ler versão
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from pathlib import Path
          import os, re
          version = Path('VERSION').read_text().strip()
          assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', version)
          if os.environ.get('GITHUB_REF_TYPE') == 'tag':
              assert os.environ['GITHUB_REF_NAME'] == 'v' + version
          print('version=' + version)
          PY
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construir imagem para o servidor
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            VCS_REF=${{ github.sha }}
          tags: |
            ghcr.io/sal0-apps/sal0-autostart:latest
            ghcr.io/sal0-apps/sal0-autostart:${{ steps.version.outputs.version }}
            ghcr.io/sal0-apps/sal0-autostart:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Testar painel e recuperação com Docker real
        timeout-minutes: 5
        run: python tests/smoke_docker.py ghcr.io/sal0-apps/sal0-autostart:${{ steps.version.outputs.version }}
      - name: Publicar somente a imagem validada
        run: |
          docker push ghcr.io/sal0-apps/sal0-autostart:${{ steps.version.outputs.version }}
          docker push ghcr.io/sal0-apps/sal0-autostart:latest
          docker push ghcr.io/sal0-apps/sal0-autostart:sha-${{ github.sha }}
      - name: Disponibilizar Compose
        uses: actions/upload-artifact@v4
        with:
          name: Sal0-AutoStart-compose
          path: docker-compose.yml
          if-no-files-found: error
